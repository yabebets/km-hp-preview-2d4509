<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デザイン案プレビュー</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F7F3EB; color: #3A302A;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.9; display: grid; min-height: 100vh; place-items: center; }
  .wrap { max-width: 560px; padding: 40px 24px; width: 100%; }
  h1 { font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 1.35rem;
    letter-spacing: .06em; margin: 0 0 6px; }
  .sub { color: #6E6157; font-size: .88rem; margin: 0 0 28px; }
  a.card { display: block; background: #fff; border: 1px solid #EADFCF; border-radius: 10px;
    padding: 20px 22px; margin-bottom: 14px; text-decoration: none; color: inherit;
    transition: border-color .2s, transform .2s; }
  a.card:hover { border-color: #C1704F; transform: translateY(-2px); }
  .no { font-size: .72rem; letter-spacing: .18em; color: #C1704F; font-weight: 600; }
  a.card h2 { font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; font-size: 1.08rem;
    margin: 4px 0 4px; letter-spacing: .03em; }
  a.card p { margin: 0; color: #6E6157; font-size: .85rem; }
  .lock { margin-top: 24px; color: #6E6157; font-size: .8rem; display: flex; gap: .5em; align-items: baseline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ホームページデザイン案プレビュー</h1>
  <p class="sub">それぞれ開いて、お渡ししたパスワードを入力してください（初回のみ）。スマホでもご覧いただけます。</p>

  <a class="card" href="./takeda.html">
    <span class="no">案 1</span>
    <h2>ストーリーテリング調（温かい・親しみ）</h2>
    <p>生成りの紙に線画イラスト。ご経歴のモチーフを散りばめた物語のようなデザイン。</p>
  </a>

  <a class="card" href="./original.html">
    <span class="no">案 2</span>
    <h2>ナチュラル調（配色3パターン切替）</h2>
    <p>画面下のボタンで「ピーチ／キャメル／ジェード」の3配色を切り替えて比較できます。</p>
  </a>

  <p class="lock">🔒 内容はパスワードで保護されています。ご意見は矢部までお知らせください。</p>
</div>
</body>
</html>
